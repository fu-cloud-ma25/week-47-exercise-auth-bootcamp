org: ${file(./config.yml):org}
service: auth-bootcamp-starting-template

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}

functions:
  ## AUTH
  login:
    handler: functions/auth/login/index.handler
    events:
      - httpApi:
          path: /api/auth/login
          method: POST
  register:
    handler: functions/auth/register/index.handler
    events:
      - httpApi:
          path: /api/auth/register
          method: POST
  ## GAMES
  getGames:
    handler: functions/games/getGames/index.handler
    events:
      - httpApi:
          path: /api/games
          method: GET
  addNewGame:
    handler: functions/games/addNewGame/index.handler
    events:
      - httpApi:
          path: /api/games
          method: POST
  deleteGame:
    handler: functions/games/deleteGame/index.handler
    events:
      - httpApi:
          path: /api/games/{id}
          method: DELETE


resources:
  Resources:
    GameDB:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: GameDB
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

